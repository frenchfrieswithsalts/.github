name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      
      # Platane/snk@v3
      - uses: Platane/snk@8f220364c1202e1c3202e88a0026e64ec576c024
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # peaceiris/actions-gh-pages@v3
      - uses: peaceiris/actions-gh-pages@4f9d45e45a0572b8109d94943f60b86a23708a28
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          

publish_branch: output
